  deco();var c=jarCol();
  $("jb").innerHTML='<svg class="jar" id="jar" viewBox="0 0 240 280" role="button" aria-label="Тапнуть гриб" tabindex="0"><rect x="40" y="30" width="160" height="30" rx="8" fill="#5c4a73"/><path d="M48 60h144v170q0 36-36 36H84q-36 0-36-36z" fill="'+c+'" opacity=".92"/><path d="M60 74c18-14 42-10 60-6s46-10 62 4c14 12 10 40-6 46-18 8-34-2-56 2s-42 8-56-6c-12-12-14-28-4-40z" fill="'+sk()[0]+'" stroke="'+sk()[1]+'" stroke-width="4"/><path d="M86 84l14 10-16 4zM152 84l-14 10 16 4z" fill="#2a1a40"/><path d="M92 108q28 16 56 0" fill="none" stroke="#2a1a40" stroke-width="5" stroke-linecap="round"/>'+hatT()+'<circle cx="92" cy="170" r="6" fill="#fff" opacity=".25"/><circle cx="150" cy="205" r="9" fill="#fff" opacity=".2"/></svg>';
}
function fmt(n){n=Math.floor(n);return n<10000?String(n):n<1e6?(n/1e3).toFixed(1)+" тыс.":n<1e9?(n/1e6).toFixed(1)+" млн":(n/1e9).toFixed(1)+" млрд"}
function upCost(i){return Math.ceil(UP[i][1]*Math.pow(1.18,G.own[i]))}
function beep(f){if(!vol)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f||260+Math.random()*120;g.gain.value=vol/400;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}}

function tap(x,y){
  if(!me||me.banned||pend>=600)return;
  var p=1+per("t");G.c+=p;pend++;beep();
  var j=$("jar");if(j){j.classList.add("sq");setTimeout(function(){j.classList.remove("sq")},80)}
  var f=document.createElement("div");f.className="fl";f.textContent="+"+p;f.style.left=x+"px";f.style.top=y+"px";$("play").appendChild(f);setTimeout(function(){f.remove()},900);
  upd();
}
$("play").addEventListener("pointerdown",function(e){if(!e.target.closest("#jar"))return;var r=$("play").getBoundingClientRect();tap(e.clientX-r.left-10,e.clientY-r.top-20)});
$("play").addEventListener("keydown",function(e){if(e.target.id==="jar"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();tap(150,120)}});
function upd(){
  if(!me)return;
  $("sc").textContent=fmt(me.taps+pend)+" тапов";
  $("ps").textContent="🍬 "+fmt(G.c)+" · +"+fmt(per("a"))+"/с · 🪙 "+coins()+" · 💎 "+G.d;
  if(tab==="p")UP.forEach(function(u,i){var b=$("u"+i);if(b)b.disabled=G.c<upCost(i)});
}
function drawUps(){
  $("ups").innerHTML=UP.map(function(u,i){return'<button class="row" id="u'+i+'" data-i="'+i+'"><span><b>'+u[0]+'</b>'+(G.own[i]?' ×'+G.own[i]:'')+'<br><span class="sub">'+(u[3]==="t"?"+"+u[2]+" за тап":"+"+u[2]+" в секунду")+'</span></span><span class="c">'+fmt(upCost(i))+' 🍬</span></button>'}).join("");
  upd();
}
$("ups").addEventListener("click",function(e){var b=e.target.closest(".row");if(!b)return;var i=+b.dataset.i,c=upCost(i);if(G.c>=c){G.c-=c;G.own[i]++;saveG();beep(440);drawUps()}});
setInterval(function(){if(me&&uid){var a=per("a");if(a){G.c+=a/10;upd()}}},100);
setInterval(function(){if(uid)saveG()},5000);

$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;render()});
function render(){
  if(!me)return;
  [].forEach.call($("tabs").children,function(x){x.className="btn "+(x.dataset.t===tab?"":"g")});
  var map={p:"tp",m:"tm",l:"tl",f:"tf",u:"tu",k:"tk"};
  for(var k in map)$(map[k]).classList.toggle("hide",k!==tab);
  if(tab==="p")drawUps();
  if(tab==="m")market();
  if(tab==="l")loadLb();
  if(tab==="f")loadFr();
  if(tab==="u")profile();
  if(tab==="k")codes();
  upd();
}
function own(it){return!it[0]||me.owned.indexOf(it[0])>=0||G.lo.indexOf(it[0])>=0}
function market(){
  $("coin").textContent="🪙 "+coins()+" · 💎 "+G.d+" (1 монетка за каждые 50 тапов)";
  $("mt").innerHTML=Object.keys(MK).map(function(k){return'<button class="btn '+(k===mcat?"":"g")+'" data-c="'+k+'">'+MK[k][0]+'</button>'}).join("");
  var list=MK[mcat][1],fld=MK[mcat][2];
  $("ml").innerHTML=list.map(function(it){
    var o=own(it),eq=(LOCAL[fld]?G[fld]:me[fld])===it[0],pv;
    if(mcat==="c")pv='<span class="nc-'+it[0]+'"><b>'+it[1]+'</b></span>';
    else if(mcat==="f")pv='<span class="sw fr fr-'+it[0]+'" style="border-radius:6px"></span><b>'+it[1]+'</b>';
    else if(mcat==="j")pv='<span class="sw" style="background:'+it[3]+'"></span><b>'+it[1]+'</b>';
    else if(mcat==="s")pv='<span class="sw" style="background:'+it[3][0]+'"></span><b>'+(it[3][2]||"")+" "+it[1]+'</b>';
    else if(mcat==="p")pv='<span style="font-size:22px;margin-right:8px">'+(it[3]||"🚫")+'</span><b>'+it[1]+'</b>'+(it[0]?' <span class="sub">+'+Math.ceil(parseInt(it[0].slice(1))/2)+' за тап</span>':'');
    else pv='<span class="sw" style="background:'+(it[3]?"linear-gradient(180deg,"+it[3][0]+","+it[3][1]+")":"#2c1646")+'"></span><b>'+it[1]+'</b>';
    return'<button class="row'+(eq?" eq":"")+'" data-id="'+it[0]+'"><span>'+pv+'</span><span class="c">'+(eq?"Надето ✓":o?"Надеть":it[2]+(it[4]?" 💎":" 🪙"))+'</span></button>';
  }).join("");
}
$("mt").addEventListener("click",function(e){var b=e.target.closest("button");if(b){mcat=b.dataset.c;market()}});
$("ml").addEventListener("click",function(e){
  var b=e.target.closest(".row");if(!b)return;
  var id=b.dataset.id,list=MK[mcat][1],fld=MK[mcat][2],it=list.filter(function(x){return x[0]===id})[0],o={};
  if(own(it)){if(LOCAL[fld]){G[fld]=id;saveG();ph();market()}else{o[fld]=id;db.doc("users/"+uid).update(o).catch(function(){toast("Не удалось")})}return}
  if(it[4]){if(G.d<it[2]){toast("Не хватает алмазов 💎");return}G.d-=it[2];G.lo.push(id);saveG();toast("Куплено: "+it[1]);beep(660);market();upd();return}
  if(coins()<it[2]){toast("Не хватает монеток 🪙");return}
  db.doc("users/"+uid).update({owned:firebase.firestore.FieldValue.arrayUnion(id),spent:firebase.firestore.FieldValue.increment(it[2])}).then(function(){toast("Куплено: "+it[1]);beep(660)}).catch(function(){toast("Покупка отклонена")});
});
function loadLb(){
  db.collection("users").orderBy("taps","desc").limit(100).get().then(function(s){
    LB={};var h="",n=0;
    s.docs.forEach(function(d){var p=d.data();if(p.banned)return;n++;LB[p.pid]=p;
      h+='<button class="row" data-p="'+p.pid+'"><span><b>'+n+'. '+nk(p)+'</b><br><span class="sub">id: '+p.pid+' · '+p.taps+' тапов</span></span><span>'+(onl(p)&&hasFr(p)?"🟢":"")+'</span></button>'});
    $("lb").innerHTML=h||'<p class="sub">Пока никого нет</p>';
  }).catch(function(){$("lb").innerHTML='<p class="msg">Не удалось загрузить рейтинг</p>'});
}
$("lb").addEventListener("click",function(e){var b=e.target.closest(".row");if(b)openP(LB[b.dataset.p],false)});
function openP(p,friend){
  if(!p)return;
  var mine=p.pid===me.pid,isF=me.friends.indexOf(p.pid)>=0,btn=mine?"":isF?'<button class="btn g" id="pf" style="width:100%">Убрать из друзей</button>':'<button class="btn" id="pf" style="width:100%">Добавить в друзья</button>';
  $("ovc").innerHTML=card(p,friend||isF)+btn+'<button class="btn g" id="pc" style="width:100%;margin-top:8px">Закрыть</button>';
  $("ov").style.display="flex";
  $("pc").onclick=function(){$("ov").style.display="none"};
  if($("pf"))$("pf").onclick=function(){
    var F=firebase.firestore.FieldValue;
    db.doc("users/"+uid).update({friends:isF?F.arrayRemove(p.pid):F.arrayUnion(p.pid)}).then(function(){$("ov").style.display="none";toast(isF?"Удалён из друзей":"Добавлен в друзья");if(tab==="f")loadFr()}).catch(function(){toast("Не удалось")});
  };
}
$("ov").addEventListener("click",function(e){if(e.target.id==="ov")$("ov").style.display="none"});
function loadFr(){
  var ids=me.friends.slice(0,50),chunks=[];
  for(var i=0;i<ids.length;i+=10)chunks.push(ids.slice(i,i+10));
  if(!chunks.length){$("fl").innerHTML='<p class="sub">Друзей пока нет. Добавьте по ID.</p>';return}
  Promise.all(chunks.map(function(c){return db.collection("users").where("pid","in",c).get()})).then(function(rs){
    var all=[];rs.forEach(function(s){s.docs.forEach(function(d){all.push(d.data())})});
    all.sort(function(a,b){return(onl(b)?1:0)-(onl(a)?1:0)});
    $("fl").innerHTML=all.map(function(p){LB[p.pid]=p;return'<button class="row" data-p="'+p.pid+'"><span><b>'+nk(p)+'</b><br><span class="sub">id: '+p.pid+' · '+p.taps+' тапов</span></span><span>'+(onl(p)?"🟢 в сети":"⚪")+'</span></button>'}).join("");
  }).catch(function(){$("fl").innerHTML='<p class="msg">Не удалось загрузить друзей</p>'});
}
$("fl").addEventListener("click",function(e){var b=e.target.closest(".row");if(b)openP(LB[b.dataset.p],true)});
$("fa").onclick=function(){
  var id=parseInt($("fi").value,10),m=$("fm");m.textContent="";
  if(!id||id===me.pid){m.textContent="Введите чужой ID";return}
  if(me.friends.indexOf(id)>=0){m.textContent="Уже в друзьях";return}
  db.collection("users").where("pid","==",id).limit(1).get().then(function(s){
    if(s.empty){m.textContent="Игрок не найден";return}
    return db.doc("users/"+uid).update({friends:firebase.firestore.FieldValue.arrayUnion(id)}).then(function(){$("fi").value="";toast("Друг добавлен");loadFr()});
  }).catch(function(){m.textContent="Ошибка связи"});
};
function profile(){
  var h=card(me,false);
  h+='<div class="card"><b>Громкость</b><input id="vol" type="range" min="0" max="100" value="'+vol+'" style="width:100%;margin:8px 0 14px"><b>Сменить пароль</b><input id="np" type="password" placeholder="Новый пароль (от 6 символов)" autocomplete="new-password"><p class="msg" id="pm"></p><div class="grid"><button class="btn" id="sp">Сохранить</button><button class="btn g" id="out">Выйти</button></div></div>';
  if(isAdm)h+='<div class="card"><b>🛠 Админ-панель</b><p class="sub">Ваш ID: '+me.pid+'<br>/tapscore ID число<br>/coins ID число<br>/candies ID число<br>/diamonds ID число<br>/upgrade ID номер число (номер 1–'+UP.length+')<br>/badge ID on|off<br>/ban ID · /unban ID<br>/promo КОД candies|diamonds|coins|pet число (КОД random = случайный)</p><input id="ac" type="text" placeholder="/candies 123456 1000000"><button class="btn" id="ar">Выполнить</button><p class="sub" id="al"></p></div>';
  $("tu").innerHTML=h;
  $("vol").oninput=function(){vol=+this.value;beep(330)};
  $("out").onclick=function(){manual=true;try{localStorage.removeItem("kb_cr")}catch(e){}flush();auth.signOut()};
  $("sp").onclick=function(){var p=$("np").value;if(p.length<6){$("pm").textContent="Минимум 6 символов";return}
    auth.currentUser.updatePassword(p).then(function(){rem(me.nick,p);$("np").value="";$("pm").textContent="";toast("Пароль изменён")}).catch(function(e){$("pm").textContent=e.code==="auth/requires-recent-login"?"Выйдите и войдите заново, затем повторите":aerr(e)})};
  if($("ar"))$("ar").onclick=admin;
}
function admin(){
  var a=$("ac").value.trim().split(/\s+/),cmd=(a[0]||"").toLowerCase(),log=$("al"),F=firebase.firestore.FieldValue;
  if(cmd==="/promo"){
    var t={candies:"c",diamonds:"d",coins:"k",pet:"p"}[(a[2]||"").toLowerCase()],pn=parseInt(a[3],10)||0,code=(a[1]||"").toUpperCase();
    if(!t){log.textContent="/promo КОД candies|diamonds|coins|pet число";return}
    if(!code||code==="RANDOM")code=Math.random().toString(36).slice(2,10).toUpperCase();
    db.doc("promos/"+code).set({t:t,n:pn}).then(function(){log.textContent="Код создан: "+code}).catch(function(e){log.textContent="Отказано: "+(e.code||e.message)});return}
  var pid=parseInt(a[1],10),arg=a[2],n=parseInt(arg,10),d;
  if(!pid){log.textContent="Укажите ID игрока";return}
  if(cmd==="/tapscore"){if(isNaN(n)||n<0){log.textContent="Нужно число ≥ 0";return}d={taps:n}}
  else if(cmd==="/coins"){if(isNaN(n)){log.textContent="Нужно число";return}d={granted:F.increment(n)}}
  else if(cmd==="/candies"){if(isNaN(n)){log.textContent="Нужно число";return}d={gc:F.increment(n)}}
  else if(cmd==="/diamonds"){if(isNaN(n)){log.textContent="Нужно число";return}d={gd:F.increment(n)}}
  else if(cmd==="/upgrade"){var ui=n-1,q=parseInt(a[3],10)||1;if(!UP[ui]){log.textContent="Номер улучшения 1–"+UP.length;return}d={};d["gu."+ui]=F.increment(q)}
  else if(cmd==="/badge"){if(arg!=="on"&&arg!=="off"){log.textContent="on или off";return}d={verified:arg==="on"}}
  else if(cmd==="/ban"){d={banned:true}}else if(cmd==="/unban"){d={banned:false}}
  else{log.textContent="Неизвестная команда";return}
  db.collection("users").where("pid","==",pid).limit(1).get().then(function(s){
    if(s.empty){log.textContent="Игрок "+pid+" не найден";return}
    return s.docs[0].ref.update(d).then(function(){log.textContent="Готово: "+cmd+" "+pid;$("ac").value=""});
  }).catch(function(e){log.textContent="Отказано: "+(e.code||e.message)});
}
setInterval(function(){if(!me||document.hidden)return;if(tab==="l")loadLb();if(tab==="f")loadFr()},20000);

/* ===== Новое: скины, питомцы, фоны, промокоды, бонусы ===== */
function sk(){var x=SK.filter(function(i){return i[0]===G.skin})[0];return x?x[3]:SK[0][3]}
function hatT(){var h=sk()[2];return h?'<text x="120" y="40" font-size="40" text-anchor="middle">'+h+'</text>':""}
function petB(){var x=PT.filter(function(i){return i[0]&&i[0]===G.pet})[0];return x?Math.ceil(parseInt(x[0].slice(1))/2):0}
function deco(){
  var x=BG.filter(function(i){return i[0]===G.bg})[0];
  document.body.style.background=x&&x[3]?"linear-gradient(180deg,"+x[3][0]+","+x[3][1]+")":"";
  var e=$("pt"),it=PT.filter(function(i){return i[0]&&i[0]===G.pet})[0];if(e)e.remove();
  if(it){e=document.createElement("div");e.id="pt";e.className="pet";e.textContent=it[3];e.title=it[1];$("play").appendChild(e)}
}
function offline(){var a=per("a"),t=Date.now()-(G.ts||Date.now());if(a>0&&t>60000){var g=a*Math.min(t/1000,7200)*.5;G.c+=g;toast("😴 Пока вас не было: +"+fmt(g)+" 🍬")}}
function claim(){
  if(String(me.nick).toLowerCase()==="admin")isAdm=true;
  var a=(me.gc||0)-G.gcc;if(a>0){G.c+=a;G.gcc=me.gc;toast("🎁 Подарок: +"+fmt(a)+" 🍬")}
  a=(me.gd||0)-G.gdc;if(a>0){G.d+=a;G.gdc=me.gd;toast("🎁 Подарок: +"+fmt(a)+" 💎")}
  var u=me.gu||{};for(var k in u){var x=u[k]-(G.guc[k]||0);if(x>0&&G.own[k]!==undefined){G.own[k]+=x;G.guc[k]=u[k];toast("🎁 Улучшение: "+UP[k][0]+" ×"+x)}}
  saveG()
}
var BI={FIXKOMBUCHE:["c",1e8],KOBYAKOV:["d",5000],"10ONLINE":["p",0]};
function give(t,n){
  if(t==="c"){G.c+=n;return"+"+fmt(n)+" 🍬"}
  if(t==="d"){G.d+=n;return"+"+fmt(n)+" 💎"}
  if(t==="k"){db.doc("users/"+uid).update({granted:firebase.firestore.FieldValue.increment(n)}).catch(function(){});return"+"+n+" 🪙"}
  if(t==="p"){var fr=PT.filter(function(x){return x[0]&&!own(x)});if(!fr.length){G.d+=500;return"+500 💎 (все питомцы уже есть)"}var p=fr[Math.floor(Math.random()*fr.length)];G.lo.push(p[0]);G.pet=p[0];return"Питомец: "+p[3]+" "+p[1]+"!"}
  return"OK"
}
function redeem(raw){
  var code=raw.trim().toUpperCase(),m=$("pcm");m.textContent="";
  if(!code){m.textContent="Введите код";return}
  if(G.codes.indexOf(code)>=0){m.textContent="Код уже использован";return}
  function ok(t,n){var r=give(t,n);G.codes.push(code);saveG();ph();upd();toast("🎉 "+r);codes()}
  if(BI[code]){ok(BI[code][0],BI[code][1]);return}
  db.doc("promos/"+code).get().then(function(s){if(!s.exists){m.textContent="Такого кода нет";return}var d=s.data();ok(d.t,+d.n||0)}).catch(function(){m.textContent="Не удалось проверить код"})
}
function codes(){
  var ready_=Date.now()-(G.dr||0)>=864e5;
  $("tk").innerHTML='<div class="card"><b>🎟 Промокод</b><input id="pk" type="text" placeholder="Введите код" maxlength="24" autocomplete="off"><p class="msg" id="pcm"></p><button class="btn" id="pkb" style="width:100%">Активировать</button></div><div class="card"><b>🎁 Ежедневный бонус</b><p class="sub">'+(ready_?"Готов к получению: 💎 50 и много конфет!":"Следующий через "+Math.ceil((864e5-(Date.now()-G.dr))/36e5)+" ч.")+'</p><button class="btn" id="drb" style="width:100%"'+(ready_?"":" disabled")+'>Забрать</button></div>';
  $("pkb").onclick=function(){redeem($("pk").value)};
  $("drb").onclick=function(){G.dr=Date.now();G.d+=50;G.c+=Math.max(1000,per("a")*600);saveG();upd();toast("🎁 Бонус получен!");codes()};
}
setInterval(function(){
  if(!me||document.hidden||tab!=="p"||$("gc")||Math.random()>.12)return;
  var g=document.createElement("div");g.id="gc";g.className="gold";g.textContent="🍬";g.style.left=(8+Math.random()*75)+"vw";g.style.top=(22+Math.random()*50)+"vh";
  g.onclick=function(){var r=Math.max(200,per("a")*90);G.c+=r;toast("✨ Золотая конфета! +"+fmt(r)+" 🍬");beep(880);g.remove();upd()};
  document.body.appendChild(g);setTimeout(function(){g.remove()},8000);
},5000);
</script>
